name: Supabase Keepalive

# Supabase Free プランは1週間アクセスがないとプロジェクトが一時停止するため、
# 数日おきに公開 API へ軽いリクエストを送る。
on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -o /dev/null \
            "$SUPABASE_URL/rest/v1/tags?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
