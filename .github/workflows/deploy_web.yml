name: Migrate DB then Deploy Web and Admin

on:
  # 本番環境（Supabase / Vercel）の準備ができるまでは手動実行のみ。
  # 手動実行で一度成功したら push: branches: [karatsu/develop] を戻す。
  workflow_dispatch:

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    # 唐津版は karatsu/develop を本番として運用する
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Supabase CLI セットアップ
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
            version: latest

      # Supabase プロジェクトへリンク（ノンインタラクティブ）
      - name: Supabase link
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_REF --password $SUPABASE_DB_PASSWORD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # マイグレーション適用（idempotent）
      - name: Supabase db push
        run: |
          supabase db push --include-all
          supabase config push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # 成功したら Vercel デプロイを開始
      - name: Trigger Vercel Deploy Hooks
        run: |
          curl -fsS -X POST "$WEB_VERCEL_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$ADMIN_VERCEL_DEPLOY_HOOK_URL"
        env:
          WEB_VERCEL_DEPLOY_HOOK_URL: ${{ secrets.WEB_VERCEL_DEPLOY_HOOK_URL }}
          ADMIN_VERCEL_DEPLOY_HOOK_URL: ${{ secrets.ADMIN_VERCEL_DEPLOY_HOOK_URL }}
